[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-brain"
version = "0.1.0"
description = "Autopilot, simulator and Drone-Bench style tasks for a DJI Phantom 3 Standard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "websockets>=12",
    "anthropic>=0.40",
    "pyyaml>=6",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["phantom_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
